<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>STORY-041 viewport capture</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #eee9df;
      }

      iframe {
        display: block;
        border: 0;
      }
    </style>
  </head>
  <body>
    <script>
      const parameters = new URLSearchParams(window.location.search);
      const width = parameters.get("width") === "320" ? 320 : 390;
      const height = parameters.get("height") === "1100" ? 1100 : 844;
      const view = parameters.get("view") || "day";
      const frame = document.createElement("iframe");
      frame.width = String(width);
      frame.height = String(height);
      frame.title = "STORY-041 visual QA";
      frame.src = `/story-041-visual.html${view === "day" ? "" : `?view=${view}`}`;
      document.body.append(frame);
    </script>
  </body>
</html>
