<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f3eb" />
    <title>Theseus Daily Workspace — STORY-040 Prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-today" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/><path d="M5 4 3 6M19 4l2 2"/></symbol>
      <symbol id="icon-insights" viewBox="0 0 24 24"><path d="M4 18V9M10 18V5M16 18v-7M22 18V2"/><path d="M2 18h20"/></symbol>
      <symbol id="icon-plan" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="m8 15 2 2 5-5"/></symbol>
      <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
      <symbol id="icon-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="icon-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1"/></symbol>
      <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
      <symbol id="icon-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3" cy="6" r="1"/><circle cx="3" cy="12" r="1"/><circle cx="3" cy="18" r="1"/></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5"/><path d="M18.5 15a7 7 0 1 1-.5-7l2 4"/></symbol>
      <symbol id="icon-undo" viewBox="0 0 24 24"><path d="m9 8-5 4 5 4"/><path d="M5 12h9a6 6 0 0 1 6 6"/></symbol>
      <symbol id="icon-sliders" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="icon-warning" viewBox="0 0 24 24"><path d="M12 3 2.8 20h18.4Z"/><path d="M12 9v4M12 17h.01"/></symbol>
      <symbol id="icon-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    </svg>

    <aside class="prototype-tools" aria-label="Prototype controls">
      <button class="prototype-toggle" id="prototype-toggle" type="button" aria-expanded="false" aria-controls="prototype-panel">
        <svg aria-hidden="true"><use href="#icon-sliders" /></svg>
        <span>Prototype</span>
      </button>
      <div class="prototype-panel" id="prototype-panel" hidden>
        <label for="state-select">Preview state</label>
        <select id="state-select"></select>
        <p>Static sample data. No API writes.</p>
      </div>
    </aside>

    <div class="app-shell">
      <nav class="side-nav" aria-label="Primary navigation">
        <div class="brand" aria-label="Theseus">T</div>
        <button class="nav-button is-active" type="button" data-destination="today" aria-current="page">
          <svg aria-hidden="true"><use href="#icon-today" /></svg><span>Today</span>
        </button>
        <button class="nav-button" type="button" data-destination="insights">
          <svg aria-hidden="true"><use href="#icon-insights" /></svg><span>Insights</span>
        </button>
        <button class="nav-button" type="button" data-destination="plan">
          <svg aria-hidden="true"><use href="#icon-plan" /></svg><span>Plan</span>
        </button>
      </nav>

      <div class="app-frame">
        <header class="app-header">
          <div>
            <p class="eyebrow" id="header-context">Thursday, July 30</p>
            <h1 id="screen-title">Today</h1>
          </div>
          <button class="icon-button account-button" type="button" aria-label="Open account">
            <svg aria-hidden="true"><use href="#icon-user" /></svg>
          </button>
        </header>

        <main id="workspace" tabindex="-1">
          <section class="destination is-active" id="view-today">
            <div class="mode-tabs" role="tablist" aria-label="Time range">
              <button type="button" role="tab" aria-selected="true" data-mode="day">Day</button>
              <button type="button" role="tab" aria-selected="false" data-mode="week">Week</button>
              <button type="button" role="tab" aria-selected="false" data-mode="month">Month</button>
            </div>

            <section class="focus-band" aria-labelledby="focus-heading">
              <div class="section-kicker-row">
                <h2 class="section-kicker" id="focus-heading">Now</h2>
                <button class="text-control running-control" id="running-control" type="button">2 running</button>
              </div>
              <div class="focus-row">
                <button class="focus-identity" id="focus-identity" type="button">
                  <span class="focus-name">Backend schema</span>
                  <span class="focus-meta">Theseus · Focus</span>
                </button>
                <span class="timer" id="focus-timer">18:42</span>
                <button class="icon-button stop-button" id="focus-action" type="button" aria-label="End Backend schema">
                  <svg aria-hidden="true"><use href="#icon-stop" /></svg>
                </button>
              </div>
            </section>

            <div class="range-row" id="today-range">
              <button class="icon-button" type="button" data-period="previous" aria-label="Previous day">
                <svg aria-hidden="true"><use href="#icon-chevron-left" /></svg>
              </button>
              <strong id="today-period-label">Thu, Jul 30</strong>
              <button class="reset-control" id="today-reset" type="button" hidden>Today</button>
              <button class="icon-button" type="button" data-period="next" aria-label="Next day" disabled>
                <svg aria-hidden="true"><use href="#icon-chevron-right" /></svg>
              </button>
            </div>

            <div class="today-layout" id="today-content"></div>
          </section>

          <section class="destination" id="view-insights" hidden>
            <div class="range-row destination-range">
              <button class="icon-button" type="button" data-insights-period="previous" aria-label="Previous review week">
                <svg aria-hidden="true"><use href="#icon-chevron-left" /></svg>
              </button>
              <strong id="insights-period-label">Jun 8 – Jun 14</strong>
              <button class="reset-control" id="insights-reset" type="button">This week</button>
              <button class="icon-button" type="button" data-insights-period="next" aria-label="Next review week">
                <svg aria-hidden="true"><use href="#icon-chevron-right" /></svg>
              </button>
            </div>
            <div id="insights-content"></div>
          </section>

          <section class="destination" id="view-plan" hidden>
            <div class="range-row destination-range">
              <button class="icon-button" type="button" data-plan-period="previous" aria-label="Previous target week">
                <svg aria-hidden="true"><use href="#icon-chevron-left" /></svg>
              </button>
              <strong id="plan-period-label">Aug 3 – Aug 9</strong>
              <button class="reset-control" id="plan-reset" type="button" hidden>Next week</button>
              <button class="icon-button" type="button" data-plan-period="next" aria-label="Next target week">
                <svg aria-hidden="true"><use href="#icon-chevron-right" /></svg>
              </button>
            </div>
            <div id="plan-content"></div>
          </section>
        </main>

        <nav class="bottom-nav" aria-label="Primary navigation">
          <button class="nav-button is-active" type="button" data-destination="today" aria-current="page">
            <svg aria-hidden="true"><use href="#icon-today" /></svg><span>Today</span>
          </button>
          <button class="nav-button" type="button" data-destination="insights">
            <svg aria-hidden="true"><use href="#icon-insights" /></svg><span>Insights</span>
          </button>
          <button class="nav-button" type="button" data-destination="plan">
            <svg aria-hidden="true"><use href="#icon-plan" /></svg><span>Plan</span>
          </button>
        </nav>
      </div>
    </div>

    <div class="overlay" id="overlay" hidden></div>
    <section class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
      <header class="drawer-header">
        <button class="icon-button" id="drawer-back" type="button" aria-label="Close detail">
          <svg aria-hidden="true"><use href="#icon-back" /></svg>
        </button>
        <h2 id="drawer-title">Detail</h2>
        <span aria-hidden="true"></span>
      </header>
      <div class="drawer-body" id="drawer-body"></div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="app.js"></script>
  </body>
</html>
